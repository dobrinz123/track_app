; TRACE GNSS Pod rev A firmware (hardware/gnss-pod/DESIGN-REV-A.md is binding).
;
; Same structure as the OBD dongle firmware in ../firmware: Arduino framework,
; all protocol / parsing / timebase logic in framework-free C modules that
; env:native compiles and unit-tests on the host, thin ESP32 wiring files.
;
; Board: custom boards/trace_pod_reva.json, derived from Espressif's
; esp32-s3-devkitm-1 definition (that devkit carries the same
; ESP32-S3-MINI-1-N8 module): 8 MB quad (QIO) flash, NO PSRAM
; (BOARD_HAS_PSRAM is deliberately not defined), native USB in
; USB-Serial/JTAG mode (ARDUINO_USB_MODE=1) with the console on it from boot
; (ARDUINO_USB_CDC_ON_BOOT=1).

[platformio]
default_envs = pod

[env:pod]
platform = espressif32
board = trace_pod_reva
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; NimBLE-Arduino 1.4.x is the NimBLE host for arduino-esp32 2.0.x (the core
; bundled with this platform). Pinned so a 2.x API change cannot break the
; build silently.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
    ; NimBLE: peripheral only on rev A (central for the ELM327 adapter is
    ; phase 2, see README). One phone connection.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_src_filter = +<*>

[env:native]
platform = native
build_flags = -std=gnu11 -Wall -Wextra -Wno-unused-parameter -lm -DUNITY_INCLUDE_DOUBLE -DUNITY_SUPPORT_64
test_build_src = yes
; Only the framework-free modules. Everything *.cpp in src/ is ESP32 wiring
; (Arduino.h, NimBLE, esp_timer ...) and does not exist on the host.
build_src_filter =
    -<*>
    +<ubx.c>
    +<ubx_hp_otp.c>
    +<gnss_config.c>
    +<timebase.c>
    +<clockmap.c>
    +<imu_fifo.c>
    +<pod_protocol.c>
    +<cn0_stats.c>
    +<console_parse.c>
    +<power_policy.c>
