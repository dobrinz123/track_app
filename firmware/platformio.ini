; TRACE OBD dongle firmware (rev-A prototype, hardware/DESIGN.md binding).
;
; Framework choice: Arduino. WiFi.h/WiFiServer implement the SoftAP + TCP
; server in a handful of calls, and arduino-esp32's bundled `driver/twai.h`
; is the SAME underlying ESP-IDF TWAI driver a pure-espidf project would use
; -- including TWAI_MODE_LISTEN_ONLY for the SNIFF_ONLY future-passive path
; -- so listen-only support is exactly as clean as it would be under
; espidf, without espidf's Kconfig/component-registry boilerplate for what
; is intentionally small, readable rev-A firmware (CONSTRAINTS).
;
; All protocol logic (elm_line_parser, elm_server_core, pid_codec,
; read_only_guard) is plain C with zero framework dependency, so env:native
; compiles and unit-tests it directly on the host.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>

; Compile-time passive/listen-only build (EXPECTED OUTCOME 2c): S pin held
; HIGH, TWAI installed in TWAI_MODE_LISTEN_ONLY, can_tx_chokepoint() never
; transmits regardless of what the guard allows. Not part of the required
; build gate; flash this env instead of env:esp32c3 for future passive use.
[env:esp32c3-sniff]
extends = env:esp32c3
build_flags = -D SNIFF_ONLY=1

[env:native]
platform = native
; -std=gnu++14 is what the .cpp test files (nullptr/auto/range-for/init
; lists) need; gcc accepts it for the .c sources too, just with a harmless
; "valid for C++/ObjC++ but not for C" warning and falls back to its C11
; default (gcc 5+) -- simplest way to satisfy both languages from one flag
; set in this small a project.
build_flags = -std=gnu++14 -Wall -Wextra
test_build_src = yes
; Only the framework-free modules -- main.cpp/wifi_ap/elm_server/can_obd/
; status_led all pull in Arduino.h or driver/twai.h, neither of which exist
; for the host toolchain.
build_src_filter =
    -<*>
    +<elm_line_parser.c>
    +<elm_server_core.c>
    +<pid_codec.c>
    +<read_only_guard.c>
    +<can_response_match.c>
