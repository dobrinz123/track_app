<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Dark Metal Infill -->
    <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D323E" />
      <stop offset="100%" stop-color="#15171E" />
    </linearGradient>

    <!-- Glowing Amber Line Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="50%" stop-color="#FFC400" />
      <stop offset="100%" stop-color="#FFE57F" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(-60, -80)">
    <!-- Main Outer Metallic Chassis 'T' -->
    <path d="M 135 150 
             L 375 150 
             L 360 215 
             L 310 215 
             L 245 425 
             L 175 425 
             L 230 215 
             L 155 215 
             Z" 
          fill="url(#darkMetalGrad)" 
          stroke="url(#silverGrad)" 
          stroke-width="10" 
          stroke-linejoin="miter" 
          stroke-miterlimit="4" />

    <!-- Metallic Inner Bevel Accents -->
    <path d="M 155 165 L 355 165 L 345 200 L 220 200 L 165 380 L 190 380 L 238 225 L 330 225 L 342 185" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="4" 
          opacity="0.7" />

    <!-- Glowing Telemetry Apex Racing Curve (Neon Amber) -->
    <path d="M 178 410 
             C 210 330, 215 290, 240 230 
             C 260 180, 310 140, 375 155 
             C 410 165, 415 205, 375 220 
             C 320 235, 275 230, 255 270 
             C 230 320, 205 375, 185 418" 
          fill="none" 
          stroke="url(#amberGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" 
          opacity="0.95" />

    <!-- Core Bright Line -->
    <path d="M 178 410 
             C 210 330, 215 290, 240 230 
             C 260 180, 310 140, 375 155 
             C 410 165, 415 205, 375 220 
             C 320 235, 275 230, 255 270 
             C 230 320, 205 375, 185 418" 
          fill="none" 
          stroke="#FFF7C2" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
